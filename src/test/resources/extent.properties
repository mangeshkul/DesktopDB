basefolder.name=test-output-extent
#basefolder.datetimepattern=d-MMM-YY HH-mm-ss

extent.reporter.spark.start=true
extent.reporter.spark.config=src/test/resources/extent-config.xml
extent.reporter.spark.out=test-output-extent/SparkReport/EcubePOS.html

extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log


extent.reporter.spark.reportName=Ecube Activity POS Automation Report
extent.reporter.spark.documentTitle=Ecube Activity POS Report

extent.reporter.pdf.start=true
extent.reporter.pdf.out=test-output-extent/PdfReport/EcubePOS.pdf

screenshot.dir=test-output-extent/SparkReport/screenshots
screenshot.rel.path=../screenshots/

systeminfo.OS=Windows
systeminfo.User=Activity POS user
systeminfo.Build=1.0
systeminfo.AppName=Ecube Admin
